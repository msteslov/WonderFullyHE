name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DM2424_ENABLE_EVALMOD_ANALYSIS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run demos
        run: |
          ./build/bin/demo_secure_stats
          ./build/bin/demo_abft
          ./build/bin/demo_noise_growth
          ./build/bin/bench_ckks fast_demo_ckks
          ./build/bin/demo_profile_report
          ./build/bin/demo_security_report
          ./build/bin/bench_bootstrap_end_to_end_fixture
