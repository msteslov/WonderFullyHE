name: Financial bootstrap experiment

on:
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  verify-financial-experiment:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DM2424_ENABLE_EVALMOD_ANALYSIS=ON

      - name: Build financial experiments
        run: cmake --build build --target experiment_credit_risk_ckks experiment_credit_risk_bootstrap -j"$(nproc)"

      - name: Run secure CKKS experiment repeatedly
        run: |
          for i in $(seq 1 20); do
            echo "SECURE_RUN=$i"
            ./build/bin/experiment_credit_risk_ckks
          done

      - name: Run bootstrap experiment repeatedly
        run: |
          for i in $(seq 1 20); do
            echo "BOOTSTRAP_RUN=$i"
            ./build/bin/experiment_credit_risk_bootstrap
          done
