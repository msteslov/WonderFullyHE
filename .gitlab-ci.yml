stages:
  - verify

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "1"
  CMAKE_BUILD_TYPE: Release

verify:linux:
  stage: verify
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates cmake git
    - git submodule sync --recursive
    - git submodule update --init --recursive --depth 1
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DBUILD_TESTING=ON
    - cmake --build build -j"$(nproc)"
    - ctest --test-dir build --output-on-failure
    - mkdir -p ci_results
    - ./build/demo_secure_stats | tee ci_results/demo_secure_stats.txt
    - ./build/demo_abft | tee ci_results/demo_abft.txt
    - ./build/demo_bootstrap_pipeline | tee ci_results/demo_bootstrap_pipeline.txt
    - ./build/demo_noise_growth | tee ci_results/demo_noise_growth.csv
    - ./build/bench_ckks | tee ci_results/bench_ckks.csv
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci_results/
      - build/Testing/Temporary/LastTest.log
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
